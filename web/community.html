<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>番茄书评与讨论</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7f6;--card:white;--text:#24372e;--muted:#72847a;--line:#e1e8e3;--accent:#287956;--active-bg:#287956}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px 18px}header{margin-bottom:22px}h1{font-size:23px;margin:0 0 6px}p{margin:8px 0}.muted,small{color:var(--muted)}nav,.controls,.pager{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,input,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card);color:var(--text)}button{cursor:pointer}button.active{background:var(--active-bg);color:white}button:disabled{opacity:.5;cursor:wait}input{min-width:0;width:160px}article{background:var(--card);padding:18px;border:1px solid var(--line);border-radius:14px;margin:12px 0}article .identity{display:flex;align-items:center;gap:10px;font-weight:600}.avatar{width:34px;height:34px;border-radius:50%}.badge{font-size:11px;border-radius:5px;color:var(--accent);border:1px solid var(--line);padding:1px 5px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}.picture{max-width:100%;max-height:320px;border-radius:8px}.meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.meta button{margin-left:auto;font-size:12px}.reply{border-left:2px solid var(--line);padding-left:14px;margin-top:14px}.empty{padding:40px;text-align:center;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace;max-height:400px;overflow:auto}details{margin:16px 0}#status{color:var(--muted)}.link{color:var(--accent)}@media(prefers-color-scheme:dark){:root{--bg:#181f1b;--card:#222c26;--text:#e0e9e3;--muted:#97aaa0;--line:#37473e;--accent:#7dd8b5;--active-bg:#347f61}}
</style></head><body><main>
<header><h1 id="title">番茄书评与讨论</h1><p class="muted">官方数据实时加载。评论只读，正文阅读时不会自动加载此页面。</p></header>
<details id="connection"><summary>书籍与连接设置</summary><div class="controls"><input id="book" aria-label="书籍 ID" placeholder="书籍 ID"><input id="chapter" aria-label="章节 ID" placeholder="章节 ID"><input id="token" type="password" autocomplete="off" aria-label="服务令牌" placeholder="服务令牌（可选）"></div><p class="muted">从阅读菜单进入时使用书源账号；浏览器调试默认匿名访问。</p></details>
<nav aria-label="评论类型"><button data-scope="book" class="active">书评</button><button data-scope="chapter">章节讨论</button><button data-scope="paragraph">段评</button></nav>
<div class="controls"><select id="sort" aria-label="排序"><option value="1">热门</option><option value="0">最新</option><option value="3">关注</option></select><input id="para" type="number" min="0" value="1" aria-label="段落索引" hidden><button id="refresh">刷新</button></div>
<p id="status" role="status">准备加载…</p><section id="items" aria-live="polite"></section>
<div class="pager"><button id="first">回到第一页</button><button id="next" disabled>下一页</button><small id="page">第 1 页</small></div>
<details><summary>完整 API 返回数据</summary><pre id="raw"></pre><button id="download">下载本页数据</button></details><p><a class="link" href="/">返回服务控制台</a></p>
</main><script src="/community.js"></script></body></html>
