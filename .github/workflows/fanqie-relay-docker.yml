name: Fanqie Relay Docker

on:
  push:
    branches: [fanqie]
    paths:
      - src/**
      - source/**
      - web/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - Dockerfile.dockerignore
      - compose.yaml
      - .github/workflows/fanqie-relay-docker.yml
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fanqie-relay-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/fanqie'
    name: Build and verify linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check embedded book-source callbacks
        run: |
          node --check source/fanqie.js
          node --check web/app.js
          node --check web/community.js
          node tests/check-source-sync.cjs
          node tests/check-source-discovery.cjs
          node tests/check-web-source-address.cjs
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fanqie-relay" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and run Rust unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fanqie-relay:test
          provenance: false
          cache-from: type=gha,scope=fanqie-relay-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fanqie-relay-${{ matrix.arch }}
      - name: Start and verify the actual container
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          trap 'docker logs relay-smoke 2>/dev/null || true; docker rm -f relay-smoke >/dev/null 2>&1 || true' EXIT
          for token in "" "ci-test-token"; do
            docker run --detach --name relay-smoke --read-only --cap-drop ALL \
              --security-opt no-new-privileges --publish 127.0.0.1:19670:19670 \
              --env FANQIE_RELAY_TOKEN="$token" fanqie-relay:test
            curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
              http://127.0.0.1:19670/health
            python3 tests/smoke-container.py --arch "$ARCH" --token "$token"
            test "$(docker inspect --format '{{.Config.User}}' relay-smoke)" != 0
            docker stop --time 10 relay-smoke
            test "$(docker inspect --format '{{.State.ExitCode}}' relay-smoke)" = 0
            docker rm relay-smoke
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=fanqie-relay-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fanqie-relay" >> "$GITHUB_ENV"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          with open('Cargo.toml', 'rb') as f:
              print('VERSION=' + tomllib.load(f)['package']['version'])
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and check both platforms
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          test "${#digests[@]}" = 2
          images=()
          for digest in "${digests[@]}"; do images+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE:latest" --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:sha-$GITHUB_SHA" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --raw > manifest.json
          python3 - <<'PY'
          import json
          with open('manifest.json') as f:
              manifest = json.load(f)
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          print('Verified manifest: linux/amd64 and linux/arm64')
          PY
          printf '### Docker image\n\n`%s:latest`\n\nPlatforms: `linux/amd64`, `linux/arm64`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
