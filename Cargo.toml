[package]
name = "cf-gateway"
version = "0.2.14"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Native page-fetch gateway with bounded challenge models and a web console"
rust-version = "1.99"

[dependencies]
axum = "0.8.6"
base64 = "0.22.1"
blake3 = "1.8.2"
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.5.51", features = ["derive", "env"] }
encoding_rs = "0.8.35"
flate2 = "1.1.5"
futures-util = "0.3.31"
hex = "0.4.3"
half = "2.7.1"
html5ever = "0.35.0"
indexmap = { version = "2.12.0", features = ["serde"] }
icu_calendar = "=2.3.0"
icu_datetime = { version = "=2.3.0", features = ["unstable_chrono_0_4"] }
icu_decimal = { version = "=2.3.0", features = ["unstable", "ryu"] }
icu_list = "=2.3.0"
icu_locale = { version = "=2.3.0", features = ["unstable"] }
icu_time = "=2.3.0"
sys-locale = "=0.3.2"
num-bigint = "0.4.6"
rand = "0.9.2"
regex = "1.12.2"
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10.9"
sysinfo = "0.37.2"
tokio = { version = "1.48.0", features = ["full"] }
tree-sitter = "0.26.0"
tree-sitter-javascript = "0.25.0"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
wreq = { version = "=0.16.1", features = ["cookies", "json", "query", "form", "socks", "gzip", "brotli", "deflate", "zstd", "stream", "charset"] }
wreq-util = "=0.2.0"
cssparser = "0.35.0"
wasmtime = { version = "49.0.0", default-features = false, features = ["cranelift", "runtime", "std"] }
crc32fast = "1.5.0"
async-compression = { version = "0.4.51", features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }

btls = "=0.5.6"
tokio-btls = "=0.5.6"
tokio-socks = "=0.5.3"
percent-encoding = "=2.3.2"
webpki-root-certs = "=1.0.10"

[profile.release]
opt-level = 3
lto = "thin"
# Same value as CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 in the Dockerfile: local and
# container binaries share one optimisation setting and local rebuilds stay fast.
codegen-units = 16
strip = true
